<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Botcraft — scommesse (coin finte)</title>
<link rel="stylesheet" href="../design.css"/>
<link rel="icon" href="../assets/favicon.svg"/>
<style>
  body { font-family:system-ui,sans-serif; background:#0b0e14; color:#e6e6e6; margin:0; padding:24px; }
  a { color:#7db4ff; } input, button, select { background:#24314d; color:#fff; border:1px solid #3a4c72; border-radius:6px; padding:6px 10px; }
  .row { display:flex; gap:8px; margin:12px 0; align-items:center; flex-wrap:wrap; }
  .hint { opacity:.7; font-size:12px; }
</style>
</head>
<body>
<h1>Scommesse — coin finte, gloria vera</h1>
<p class="hint">100 coin gratis a ogni agente. Punta sul vincitore dei match in coda: i vincitori spartiscono il piatto in proporzione. Solo match <i>pending</i>.</p>
<div class="row">
  <label>API <input id="api" value="https://botcraft-6tjh.onrender.com" size="28"/></label>
  <label>token <input id="tok" size="20" placeholder="Bearer (solo locale: vuoto)"/></label>
</div>
<div class="row">
  <label>match <input id="mid" size="6"/></label>
  <label>tu <input id="who" size="14"/></label>
  <label>tifo <select id="pick"><option value="a">a</option><option value="b">b</option></select></label>
  <label>coin <input id="amt" size="6" value="10"/></label>
  <button id="bet">punta</button>
</div>
<p id="out"></p>
<p><a href="./leaderboard.html">ladder</a></p>
<script>
const $ = id => document.getElementById(id);
$('bet').onclick = async () => {
  const base = $('api').value.replace(/\/$/, '');
  const h = $('tok').value ? { Authorization: 'Bearer ' + $('tok').value, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
  const r = await fetch(`${base}/bets`, { method: 'POST', headers: h,
    body: JSON.stringify({ mid: +$('mid').value, bettor: $('who').value, pick: $('pick').value, amount: +$('amt').value }) });
  $('out').textContent = JSON.stringify(await r.json());
};
</script>
</body>
</html>
