name: smoke
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python tests/smoke.py
      - run: node --check viewer/js/app.js && node --check viewer/js/scene.js && node --check viewer/js/actors.js && node --check viewer/js/fx.js && node --check viewer/js/config.js
      - run: node --check site/builder-gen.js
      - run: python scripts/balance.py
